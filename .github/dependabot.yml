# Dependabot設定 — u18 Identity
# pnpm workspaceのため、npmエコシステムはルート（"/"）の1エントリで
# 全workspaceパッケージを対象にできる。apps/*やpackages/*を個別に列挙しない。
version: 2

updates:
  # --- npm (pnpm workspace) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "infra"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Cloudflare のランタイム一式は必ずまとめて上げる。
      #
      # @cloudflare/vitest-pool-workers は workerd を同梱しており、
      # wrangler.jsonc の compatibility_date がその workerd のビルド日より
      # 後だと、テストが 1 件も走らずプール起動時に
      # MiniflareCoreError: ERR_FUTURE_COMPATIBILITY_DATE で全滅する。
      # このため両 wrangler.jsonc は compatibility_date を意図的に
      # 2026-08-15 に固定してある。
      #
      # 厄介なのは失敗の見え方で、`wrangler dev` は動き続けるのに
      # テストだけが落ちるため、バンプと無関係な破損に見える。
      # 単独バンプを作らせないことでこれを防ぐ。
      #
      # @cloudflare/workers-types も同じ理由で同梱する。
      # packages/config/tsconfig.lib.json が全パッケージに対して
      # "types": ["@cloudflare/workers-types"] を設定しており、これは
      # compatibility_date が選ぶのと同じランタイム表面を記述している。
      # 単独で上がると、固定した workerd に存在しない API を参照しても
      # typecheck が緑のまま通る（型は新しいが実行環境は古い）。
      #
      # 上げるときは compatibility_date も併せて見直すこと（#24）。
      cloudflare-workers-runtime:
        applies-to: version-updates
        patterns:
          - "@cloudflare/vitest-pool-workers"
          - "@cloudflare/workers-types"
          - "miniflare"
          - "wrangler"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # minor/patchはまとめてPRノイズを減らす
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # セキュリティ更新は種類を問わずまとめて優先処理する
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # typescript 5.9.3 固定。typescript-eslint 8.x が <6.1.0 を要求するため
      # majorバンプ（6.x）のPRは作らせない。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # vitest 4.1.12 固定。@cloudflare/vitest-pool-workers 0.23.0 が
      # peer で ^4.1.0 を要求するため majorバンプは不可。
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "ci-cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

# Dependabot設定 — u18 Identity
# pnpm workspaceのため、npmエコシステムはルート（"/"）の1エントリで
# 全workspaceパッケージを対象にできる。apps/*やpackages/*を個別に列挙しない。
version: 2

updates:
  # --- npm (pnpm workspace) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # 公開から 7 日経っていないバージョンの PR を開かせない。
    #
    # npm アカウントの乗っ取りで悪意ある版が publish された場合、発覚から
    # yank までは数時間〜数日で収まることが多い。待つだけで大半を避けられる。
    #
    # このリポジトリではブランチ保護が使えず（Free プラン / #58）、実際に
    # Dependabot の PR が CI 無しで main に入ったことがある。人間のレビューだけ
    # が歯止めになっている以上、機械的な時間差の価値は相対的に大きい。
    #
    # この値は pnpm-workspace.yaml の minimumReleaseAge と対になる（#101）。
    # minimumReleaseAge は「若すぎる版は install しない」という強制で、
    # --frozen-lockfile の install も止まる。cooldown のほうが短いと、
    # Dependabot が install できない PR を毎週開くことになり、赤い
    # Dependabot PR が常態化して誰も見なくなる。
    # **必ず cooldown >= minimumReleaseAge を保つこと。**
    #
    # security update には cooldown が適用されない（GitHub の仕様）。
    # 緊急の脆弱性修正が遅れないので、その点は意図どおり。
    cooldown:
      default-days: 7
    labels:
      - "infra"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Cloudflare のランタイム一式は必ずまとめて上げる。
      #
      # @cloudflare/vitest-plugin は wrangler 経由で workerd を連れてくる。
      # wrangler.jsonc の compatibility_date がその workerd の知らない日付だと、
      # テストが 1 件も走らず起動時に
      # MiniflareCoreError: ERR_FUTURE_COMPATIBILITY_DATE で全滅する。
      # このため 3 つの wrangler.jsonc は compatibility_date を意図的に
      # 2026-08-15 に固定してある（上限はビルド日とは一致しない。#108）。
      #
      # 厄介なのは失敗の見え方で、`wrangler dev` は動き続けるのに
      # テストだけが落ちるため、バンプと無関係な破損に見える。
      # 単独バンプを作らせないことでこれを防ぐ。
      #
      # @cloudflare/workers-types も同じ理由で同梱する。
      # packages/config/tsconfig.lib.json が全パッケージに対して
      # "types": ["@cloudflare/workers-types"] を設定しており、これは
      # compatibility_date が選ぶのと同じランタイム表面を記述している。
      # 単独で上がると、固定した workerd に存在しない API を参照しても
      # typecheck が緑のまま通る（型は新しいが実行環境は古い）。
      #
      # 上げるときは compatibility_date も併せて見直すこと（#24）。
      cloudflare-workers-runtime:
        applies-to: version-updates
        patterns:
          # 旧名。#108 で @cloudflare/vitest-plugin へ移行済みだが、
          # 残しておいても無害で、取り違えて戻した場合に拾える。
          - "@cloudflare/vitest-pool-workers"
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/workers-types"
          - "miniflare"
          - "wrangler"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # minor/patchはまとめてPRノイズを減らす
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # セキュリティ更新は種類を問わずまとめて優先処理する
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # typescript 5.9.3 固定。typescript-eslint 8.x が <6.1.0 を要求するため
      # majorバンプ（6.x）のPRは作らせない。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # vitest 4.1.12 固定。@cloudflare/vitest-plugin 1.4.7 の peer は
      # ^4.1.0 || ^5.0.0 なので 5 系も入りうるが、#108 の移行では
      # 一度に 2 つ動かさないため据え置いた。上げるなら単独の判断で。
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "ci-cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init と analyze は同一リポジトリの同一バージョンでなければならない。
      # major 更新はグループ化されないとパスごとに別 PR へ割れ、片方だけ
      # マージすると init@v4 + analyze@v3 というサポートされない組み合わせが
      # main に残る。
      #
      # しかも CodeQL ジョブは public リポジトリでのみ実行されるため（#26）、
      # private の間は壊れた組み合わせでも CI は緑のままで誰も気づかない。
      # 実際 #63 と #67 がこの形で割れ、レビューで気づいて連続マージした。
      #
      # 既存グループより上に置くこと。Dependabot は最初にマッチした
      # グループへ割り当てるため、順序が逆だと効かない（#24 と同じ論点）。
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

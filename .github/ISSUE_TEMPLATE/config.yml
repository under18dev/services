# **空の issue を許さない。**
#
# 許すと `/issues/new` から本文が完全に空の issue を立てられ、**テンプレートの
# 案内も下の contact link も一度も表示されない**。#222 でバグ報告テンプレートの
# 案内を直したが、塞いだのは「古い案内が読まれる」ほうで、「案内がそもそも
# 表示されない」経路はここに残っていた。
#
# 代わりに「その他」テンプレートを置いてあるので、分類に迷っても行き先はある。
blank_issues_enabled: false
contact_links:
  - name: セキュリティ脆弱性の報告（非公開）
    url: https://github.com/under18dev/services/security/advisories/new
    about: 認証バイパス・トークン漏洩・権限昇格などは、公開 issue ではなくこちらから非公開で報告してください。実トークンやSecretの値は貼らないでください。
  - name: 仕様書を読む
    url: https://github.com/under18dev/services/blob/main/docs/u18-identity-spec.md
    about: アーキテクチャ、OIDC仕様、セキュリティ要求、実装フェーズはこちらに記載されています。
  - name: 未決定事項の一覧
    url: https://github.com/under18dev/services/issues?q=is%3Aissue+label%3Aneeds-decision
    about: 仕様書「14. 未決定事項」に関する議論中のIssue。提案前に重複がないか確認してください。

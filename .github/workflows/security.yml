name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 依存の新しい脆弱性は push が無くても出てくるので、週次でも回す。
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CodeQL（Code scanning）と dependency-review は、private リポジトリでは
  # GitHub Advanced Security が要る。under18dev は Free プランなので、
  # private の間は実行しない。仕様書 12 の Phase 3 で public にした時点で
  # 自動的に有効になる。
  # public になった時点で自動的に動き出すようゲートしてある（#26）。
  # **ゲートは外さない。** private に戻すと GHAS が無いため両ジョブは
  # 永続的に失敗し、恒久的に赤い CI は見なくなった時点で無いのと同じになる。
  # 可視性に追従させておけば、戻したときも静かに skip するだけで済む。
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # 認証基盤なので既定より広い security-extended を使う。
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # Worker にバンドルされるのは production 依存だけ。ここは本番に
      # 到達しうる脆弱性なので CI を落とす。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # dev 依存は実行時に載らない。現状の high は 2 件:
      #   zod    @cloudflare/vitest-plugin@1.4.7 が 4.6.5 を固定（修正版 >=4.6.6）
      #   undici miniflare 配下。wrangler 側からも入るので移行では消えない
      # どちらも上流が上げるまで解消できない。可視化だけして CI は落とさない。
      #
      # #108 の移行で sharp は消え、件数は 6 → 2 になった（sharp は
      # 旧 vitest-pool-workers 配下にしか無かった）。
      - name: Audit dev dependencies (informational)
        continue-on-error: true
        run: pnpm audit --audit-level high

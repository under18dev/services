name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 依存の新しい脆弱性は push が無くても出てくるので、週次でも回す。
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CodeQL（Code scanning）と dependency-review は、private リポジトリでは
  # GitHub Advanced Security が要る。under18dev は Free プランなので、
  # private の間は実行しない。仕様書 12 の Phase 3 で public にした時点で
  # 自動的に有効になる。
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          # 認証基盤なので既定より広い security-extended を使う。
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace

      # Worker にバンドルされるのは production 依存だけ。ここは本番に
      # 到達しうる脆弱性なので CI を落とす。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # dev 依存は実行時に載らない。現状の high はすべて
      # @cloudflare/vitest-pool-workers 配下の sharp / zod で、
      # pool-workers を上げない限り解消できない（上げると workerd の
      # compatibility_date 制約に当たる）。可視化だけして CI は落とさない。
      - name: Audit dev dependencies (informational)
        continue-on-error: true
        run: pnpm audit --audit-level high

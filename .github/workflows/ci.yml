name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR では後から来た push で前の実行を打ち切る。main では打ち切らない
# （デプロイ判断の根拠になる実行を消さないため）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace

      # packages/config/eslint.layers.js の no-restricted-imports が
      # Presentation -> Application -> Domain の依存方向（仕様書 2.3）を守らせる。
      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm exec prettier --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      # worker-configuration.d.ts は `wrangler types` の出力をコミットしている。
      # クリーンな checkout で codegen 無しに typecheck できる利点があるが、
      # wrangler.jsonc を変えて再生成を忘れると、実際の binding と食い違った
      # 型のまま typecheck が緑で通ってしまう。
      #
      # tsc より前に置くのは、これが「型が間違っている」失敗であって
      # ツールの不調ではないため。先に出たほうが読み解きやすい。
      #
      # 生成直後の出力をそのまま比較すること。prettier を通すと整形差分が
      # drift に見える（これらのファイルは .prettierignore に入っている）。
      # 新規ファイルは untracked として現れるので git diff では検出できない。
      - name: Check generated Worker types are up to date
        run: |
          pnpm cf-typegen >/dev/null
          drift="$(git status --porcelain -- 'apps/*/worker-configuration.d.ts')"
          if [ -n "$drift" ]; then
            echo "::error::worker-configuration.d.ts is out of date. Run 'pnpm cf-typegen' and commit the result -- do not revert the change that caused it."
            echo "$drift"
            git --no-pager diff -- 'apps/*/worker-configuration.d.ts'
            exit 1
          fi
          echo "Generated Worker types are up to date."

      - name: tsc
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace

      # auth-worker の統合テストは packages/db/drizzle/ の生成済み SQL を読んで
      # miniflare の D1 にスキーマを作る。schema を変えてマイグレーション生成を
      # 忘れた PR でも CI が通ってしまわないよう、テスト前に必ず生成しておく。
      - name: Generate Drizzle migrations
        run: pnpm db:generate

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace

      # 各 Worker の build は `wrangler deploy --dry-run`。Cloudflare への
      # 認証は不要なので、PR からの実行でも secrets を渡さない。
      - name: Build workers (default env)
        run: pnpm build

      # 本番は `wrangler deploy --env production` で出す（deploy.yml）。
      # env.production は d1_databases / vars / Service Binding を再定義する
      # ため、既定 env の dry-run だけでは本番側の設定を一度も評価していない。
      #
      # 実測で捕まる誤りの種類（#57）:
      #   - JSON として壊れている場合はファイル全体のパースが失敗するため、
      #     既定 env の dry-run でも落ちる。このステップ固有の価値ではない。
      #   - 既定を素通りして --env production でのみ落ちるのは、JSON としては
      #     読めるがスキーマ検証に通らないもの。型違い（"vars" を文字列にする等）
      #     と必須フィールドの欠落がこれにあたる。ここがこのステップの価値。
      #   - binding 名の typo と無効な compatibility_flags は、どちらの dry-run
      #     でも検知できない。wrangler がローカルで検証しないため（#57）。
      - name: Build workers (production env)
        run: |
          pnpm --filter @u18/auth-worker exec \
            wrangler deploy --dry-run --env production --outdir dist/production
          pnpm --filter @u18/dashboard-worker exec \
            wrangler deploy --dry-run --env production --outdir dist/production

  # ブランチ保護で要求する単一のステータス。個別ジョブを足しても
  # 保護設定を触らずに済むよう、ここで集約する。
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

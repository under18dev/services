name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR では後から来た push で前の実行を打ち切る。main では打ち切らない
# （デプロイ判断の根拠になる実行を消さないため）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # packages/config/eslint.layers.js の no-restricted-imports が
      # Presentation -> Application -> Domain の依存方向（仕様書 2.3）を守らせる。
      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm exec prettier --check .

      # Service Binding の宛先が、同じ env でデプロイされる Worker の名前と
      # 一致しているかを検査する（#57 の項目 2 / #42）。
      #
      # `wrangler deploy --dry-run` はリモートを参照しないので、存在しない
      # Worker を指す Service Binding でも正常終了する。#42 の取り違えは
      # レビューで見つかったのであって、CI では一度も捕まっていない。
      #
      # 実行ではなく静的な突き合わせにしているのは CodeQL の SHA 検査と
      # 同じ理由で、デプロイしてみるまで待てないため。Cloudflare の
      # 認証情報は要らない。
      - name: Check service binding targets
        run: pnpm check:bindings

      # Workers route の `/*` は裸の接頭辞を拾わない。`/account/*` だけ
      # だと `/account` が別の Worker へ落ちる。本番で踏んでから入れた
      # （#137 に続いて 2 回目）。
      - name: Check route patterns
        run: pnpm check:routes

      # `set -e` の下で、一致ゼロの `grep` を変数に取る形を落とす（#231）。
      #
      #   var="$(... | grep foo)"
      #
      # 一致が無いと `grep` が 1 で終わり、代入ごとスクリプトが落ちる。
      # **落ちること自体は正しい。問題は何も言わずに落ちること** ——
      # 直後に書いた `::error::` に届かないので、デプロイが赤いのに理由が
      # 1 行も出ない。
      #
      # **このリポジトリで 4 回入っている**（preflight の `grep -c`、
      # smoke-form-probe の 2 箇所、そして codeql 照合は `|| true` 付きで
      # 書けていた）。うち 2 件は私が書き、3 セッションのレビューを通って
      # いる。「気をつける」では止まらないことが分かっている形なので、
      # 人ではなく機械に見させる。
      - name: Check shell exit-status traps
        run: pnpm check:shell

      # github/codeql-action の init と analyze は同一バージョンでなければ
      # ならない。Dependabot 側は #71 でグループ化したので割れた PR は
      # 作られないが、手で編集してずらすことは依然できる。
      #
      # そしてそのズレは CI からは見えない。CodeQL ジョブは public
      # リポジトリでのみ実行されるため（#26）、private の間は壊れた
      # 組み合わせでも何の信号も出ず、public 化した日に初めて露見する。
      # だから実行ではなく静的な突き合わせで検査する。
      - name: Check codeql-action refs are consistent
        run: |
          refs="$(grep -ho 'github/codeql-action/[a-zA-Z0-9_-]*@[0-9a-f]\{40\}' \
            .github/workflows/*.yml .github/actions/*/*.yml 2>/dev/null || true)"

          if [ -z "$refs" ]; then
            echo "No codeql-action references found; nothing to check."
            exit 0
          fi

          echo "$refs" | sed 's/^/  /'

          distinct="$(echo "$refs" | sed 's/.*@//' | sort -u | wc -l | tr -d ' ')"
          if [ "$distinct" != "1" ]; then
            echo "::error::github/codeql-action references point at $distinct different commits. init and analyze must be the same version; a mismatch is invisible here because the CodeQL job only runs on public repositories (#26)."
            exit 1
          fi

          echo "All codeql-action references are pinned to the same commit."

  deadlines:
    # **独立したジョブにしてある。**
    #
    # この検査は**差分と無関係に落ちる** —— 記録された期限が来た日から、
    # 誰がどんな PR を出しても赤くなる。`Lint & format` の中に混ぜると
    # 「自分の変更が lint に落ちた」に見えて、踏んだ人が原因を自分の差分に
    # 探す。ジョブ名が `Deadlines` なら、チェック一覧を見た時点で
    # **自分のせいではない**と分かる。
    #
    # これを曖昧にすると、#234 とは逆向きの事故が起きる —— 赤を消すために
    # 期限だけ伸ばす、が定着する。それは条件に戻すのと同じことである。
    name: Deadlines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Check deadlines
        run: pnpm check:deadlines

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # worker-configuration.d.ts は `wrangler types` の出力をコミットしている。
      # クリーンな checkout で codegen 無しに typecheck できる利点があるが、
      # wrangler.jsonc を変えて再生成を忘れると、実際の binding と食い違った
      # 型のまま typecheck が緑で通ってしまう。
      #
      # tsc より前に置くのは、これが「型が間違っている」失敗であって
      # ツールの不調ではないため。先に出たほうが読み解きやすい。
      #
      # 生成直後の出力をそのまま比較すること。prettier を通すと整形差分が
      # drift に見える（これらのファイルは .prettierignore に入っている）。
      # 新規ファイルは untracked として現れるので git diff では検出できない。
      - name: Check generated Worker types are up to date
        run: |
          pnpm cf-typegen >/dev/null
          drift="$(git status --porcelain -- 'apps/*/worker-configuration.d.ts')"
          if [ -n "$drift" ]; then
            echo "::error::worker-configuration.d.ts is out of date. Run 'pnpm cf-typegen' and commit the result -- do not revert the change that caused it."
            echo "$drift"
            git --no-pager diff -- 'apps/*/worker-configuration.d.ts'
            exit 1
          fi
          echo "Generated Worker types are up to date."

      - name: tsc
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # auth-worker の統合テストは packages/db/drizzle/ の生成済み SQL を読んで
      # miniflare の D1 にスキーマを作る。schema を変えてマイグレーション生成を
      # 忘れた PR でも CI が通ってしまわないよう、テスト前に必ず生成しておく。
      - name: Generate Drizzle migrations
        run: pnpm db:generate

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # 各 Worker の build は `wrangler deploy --dry-run`。Cloudflare への
      # 認証は不要なので、PR からの実行でも secrets を渡さない。
      - name: Build workers (default env)
        run: pnpm build

      # 本番は `wrangler deploy --env production` で出す（deploy.yml）。
      # env.production は d1_databases / vars / Service Binding / routes を
      # 再定義するため、既定 env の dry-run だけでは本番側の設定を一度も
      # 評価していない。
      #
      # Worker を列挙せず apps/*/wrangler.jsonc を走査するのは、列挙だと
      # Worker が増えたときに足し忘れるから。実際 #92 で nfc-worker が
      # 入ったとき、その env.production は CI のどこからも評価されない
      # 状態になった。走査にしておけば次の Worker は黙って対象に入る。
      #
      # かつてこのステップは直前の `pnpm build` に暗黙に依存していた。
      # auth-worker のクライアント JS は .gitignore 済みの生成物で、
      # 生成が npm スクリプト側にしか無かったため、wrangler を直接呼ぶ
      # 経路では作られなかった。#132 でその生成が wrangler.jsonc の
      # `build.command` に移り、dev / deploy / dry-run のどこから入っても
      # 走るようになったので、この依存は無くなっている。
      # 生成物を消した状態でこのステップ単独が通ることを確認済み。
      #
      # 実測で捕まる誤りの種類（#57）:
      #   - JSON として壊れている場合はファイル全体のパースが失敗するため、
      #     既定 env の dry-run でも落ちる。このステップ固有の価値ではない。
      #   - 既定を素通りして --env production でのみ落ちるのは、JSON としては
      #     読めるがスキーマ検証に通らないもの。型違い（"vars" を文字列にする等）
      #     と必須フィールドの欠落がこれにあたる。ここがこのステップの価値。
      #   - binding 名の typo と無効な compatibility_flags は、どちらの dry-run
      #     でも検知できない。wrangler がローカルで検証しないため（#57）。

      # **生成物を消してから本番 dry-run を回す。**
      #
      # 上の「この依存は無くなっている」は auth-worker については本当だったが、
      # **検査で担保されていなかった。** dashboard-worker にアイランドが入った
      # とき `build.command` が付かず、直前の `pnpm build` が npm スクリプト
      # 経由で bundle を作っていたせいで CI は緑のまま、本番デプロイだけが
      #   Could not resolve "./generated/account-island.bundle"
      # で落ちた。#132 と同じ形を、別の Worker で繰り返したことになる。
      #
      # 消してから回せば、各 Worker が `wrangler deploy` だけで自立して
      # いることが毎回確かめられる。Worker が増えても走査なので黙って
      # 対象に入る。
      # 消す対象を **.gitignore に委ねる**。`find ... -name generated -path "*/ui/*"`
      # だと「generated という名前で ui/ の下にある」という命名規約に依存し、
      # 別の置き方をした Worker が増えたときに**黙って対象から外れる**。
      # それは #216 で塞いだ穴（auth-worker では成立していた前提が、後から
      # 増えた dashboard-worker には何も言っていなかった）と同じ形になる。
      #
      # 生成物は必ず .gitignore に載る（載せなければコミットされてしまい、
      # それはそれで別の、もっと目立つ失敗になる）。その**必ず更新される側**に
      # 紐づければ、置き場所が変わっても追従する。
      #
      # 範囲を apps/*/src に限るのは node_modules を消さないため。
      - name: Drop generated client bundles
        run: git clean -fdX apps/*/src

      - name: Build workers (production env)
        run: |
          checked=0
          for cfg in apps/*/wrangler.jsonc; do
            [ -e "$cfg" ] || continue
            app="$(dirname "$cfg")"
            checked=$((checked + 1))
            echo "::group::$app --env production"
            ( cd "$app" && pnpm exec wrangler deploy --dry-run --env production --outdir dist/production )
            echo "::endgroup::"
          done

          # glob が 1 件も当たらなければ、このステップは何も検査していない。
          # 緑のまま素通りさせず、ワークフロー側の不具合として落とす。
          if [ "$checked" = "0" ]; then
            echo "::error::No apps/*/wrangler.jsonc found. The production dry-run checked nothing."
            exit 1
          fi
          echo "Checked $checked worker(s) with --env production."

  # ブランチ保護で要求する単一のステータス。個別ジョブを足しても
  # 保護設定を触らずに済むよう、ここで集約する。
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, deadlines, typecheck, test, build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "deadlines=${{ needs.deadlines.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

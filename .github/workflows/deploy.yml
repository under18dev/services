name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/setup-workspace/action.yml"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: D1 マイグレーションの適用を飛ばす
        type: boolean
        default: false

# デプロイは同時に走らせない。RPC 契約の変更時にデプロイ順が崩れると
# dashboard-worker が存在しない entrypoint を呼ぶ（仕様書 4.4）。
#
# このワークフローは必ず `--env production` でデプロイする。付け忘れると
# Worker 名が `u18-auth` / `u18-dashboard` になり、本番の dashboard が指す
# `u18-auth-production` とは別物が増えるだけで、どこからも束縛されない
# 孤児 Worker が残る（#42）。部分的に手でデプロイした後はこれを確認すること。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cloudflare 側の準備が終わるまで、main への push のたびに赤くするのではなく
  # 理由を示して停止する。
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: check
        name: Check deploy prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          blockers=0
          summary=""

          note() { # 1 行の blocker を記録する
            blockers=$((blockers + 1))
            summary="${summary}
          - $1"
            ready=false
          }

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            note "Cloudflare secrets are not set (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)."
          fi

          # wrangler.jsonc に残る placeholder を埋める前にデプロイすると、
          # 存在しない DB を指すか、localhost を広告する Worker が本番に出る。
          #
          # 残り 1 件になっても「ほぼ緑」ではない。1 件でもデプロイは止まる。
          # 件数と残っている中身を必ず出し、読んだ人が推測しなくて済むようにする。
          #
          # 対象ファイルを列挙しないのは、列挙だと Worker が増えたときに
          # 足し忘れるから。#92 で nfc-worker が入ったとき、ここは 2 ファイル
          # しか見ておらず、REPLACE_WITH_NFC_D1_DATABASE_ID が残ったままでも
          # preflight は緑になる状態だった。走査なら次の Worker も自動で入る。
          configs=""
          for cfg in apps/*/wrangler.jsonc; do
            [ -e "$cfg" ] || continue
            configs="$configs $cfg"
          done

          if [ -z "$configs" ]; then
            # glob が当たらないのは「placeholder が無い」ではなく
            # 「検査できていない」。緑にせず blocker として扱う。
            note "No apps/*/wrangler.jsonc found, so the placeholder check never ran. This is a workflow bug, not a clean tree."
          fi

          found=0
          for f in $configs; do
            n="$(grep -c "REPLACE_WITH_" "$f" || true)"
            found=$((found + n))
          done

          if [ "$found" != "0" ]; then
            note "$found REPLACE_WITH_ placeholder(s) remain in wrangler config:"
            for f in $configs; do
              hits="$(grep -n "REPLACE_WITH_" "$f" || true)"
              [ -z "$hits" ] && continue
              summary="${summary}
              $f:"
              while IFS= read -r line; do
                summary="${summary}
                $line"
              done <<< "$hits"
            done
          fi

          {
            echo "## Deploy preflight"
            echo
            if [ "$ready" = "true" ]; then
              echo "All prerequisites satisfied. Proceeding with deploy."
            else
              echo "**Deploy is BLOCKED.** $blockers blocker(s) remaining:"
              echo "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ready" = "true" ]; then
            echo "All deploy prerequisites satisfied."
          else
            echo "::warning::Deploy is BLOCKED by $blockers item(s). Nothing will be deployed. See the job summary for details."
            echo "$summary"
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && !inputs.skip_migrations
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # スキーマから生成した SQL がコミットされているかを確かめる。
      # 生成漏れのまま本番に当てると、コードと DB が食い違う。
      - name: Verify migrations are committed
        run: |
          pnpm db:generate
          # 差分が無ければ drizzle-kit は何も書かない（"No schema changes"）。
          # 新規マイグレーションは追跡外ファイルとして現れるので、git diff では
          # 検出できない。untracked も見る git status を使う。
          #
          # packages/db だけでなく packages/*/ を見る。ルートの db:generate は
          # Identity と NFC の両方を生成するのに、ここが packages/db しか
          # 見ていないと NFC スキーマの生成漏れを素通しする（#92）。
          #
          # 末尾の /* は必須。git の pathspec はワイルドカードを含んだ時点で
          # 「ディレクトリ前方一致」をやめてフルパスの glob 照合になるため、
          # 'packages/*/drizzle' は packages/db/drizzle/0000_x.sql に
          # 一致せず、drift を 1 件も出さないまま緑になる。
          # 検査範囲を広げたつもりで全滅させうるので、下の自己検査を外さないこと。
          pathspec='packages/*/drizzle/*'

          tracked="$(git ls-files -- "$pathspec" | wc -l | tr -d ' ')"
          if [ "$tracked" = "0" ]; then
            echo "::error::The pathspec '$pathspec' matches no tracked migration files, so the drift check would pass without checking anything. Fix the pathspec, do not relax this guard."
            exit 1
          fi
          echo "Drift pathspec '$pathspec' covers $tracked tracked file(s)."

          drift="$(git status --porcelain -- "$pathspec")"
          if [ -n "$drift" ]; then
            echo "::error::Drizzle schema and committed migrations are out of sync. Run 'pnpm db:generate' and commit the generated SQL."
            echo "$drift"
            exit 1
          fi

      # env.production は d1_databases を再定義するので、--env を付けないと
      # 開発側の binding にマイグレーションを当ててしまう。
      - name: wrangler d1 migrations apply (Identity)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: pnpm exec wrangler d1 migrations apply u18-identity --remote --env production

      # NFC は Identity とは別の D1（仕様書 4.1 / apps/nfc-worker/wrangler.jsonc）。
      # binding も migrations_dir も分かれているので、適用も別に実行する。
      # ここを auth-worker の working-directory から打つと、
      # migrations_dir が packages/db を指したまま Identity 用の SQL を
      # NFC の DB に流し込むので、必ず apps/nfc-worker から実行すること。
      #
      # 2 つの DB は互いに独立なので順序に意味は無い。ただし Identity が
      # 適用済みで NFC が失敗する中途半端な状態はありうる（別 DB なので
      # 巻き戻さず、再実行で先へ進める）。
      - name: wrangler d1 migrations apply (NFC)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/nfc-worker
        run: pnpm exec wrangler d1 migrations apply u18-nfc --remote --env production

  # auth-worker が先。dashboard-worker は IdentityRPC entrypoint に依存するため、
  # 新しい RPC メソッドを使う dashboard を先に出すと参照先が無い（仕様書 4.4）。
  deploy-auth-worker:
    name: Deploy auth-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, migrate]
    if: always() && needs.preflight.outputs.ready == 'true' && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # auth-worker は development 以外で IP_HASH_PEPPER / SIGNING_KEY_JWK が
      # 無いと起動を拒否する。デプロイ自体は成功して実リクエストで初めて落ちる
      # ため、先に Workers Secret の「名前」だけを確認しておく（値は取得しない）。
      # 初回デプロイ時は Worker 自体が存在せず一覧を取れないので、ここでは
      # 落とさずに警告にとどめる。
      #
      # SIGNING_KEY_KID は必須に含めない。#23 で Secret が JWK Set 形式に
      # なり、現役 kid は Set の中で示されるようになったため、新しく作る
      # 環境ではこの Secret 自体が存在しない（runbook 2.4.4）。
      # 必須のまま残すと「存在しなくてよいものが無い」と毎回警告することに
      # なり、本物の Missing が出たときに読み飛ばされる。
      #
      # 旧形式（単一 JWK + SIGNING_KEY_KID）の環境もコードは受け付けるので、
      # 在る場合は在ると表示するだけにして、無いことを異常としない。
      - name: Check required Worker secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: |
          if ! secrets_json="$(pnpm exec wrangler secret list --env production 2>/dev/null)"; then
            echo "::warning::Could not list Worker secrets (the Worker may not exist yet on a first deploy). Skipping the check."
            exit 0
          fi

          missing=""
          for name in SIGNING_KEY_JWK IP_HASH_PEPPER; do
            echo "$secrets_json" | grep -q "\"$name\"" || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::warning::Missing Worker secrets:$missing. Set them with 'wrangler secret put <NAME> --env production'; auth-worker refuses to boot without them outside development."
          else
            echo "All required Worker secrets are present."
          fi

          # 旧形式の名残。無いのが正常なので、在るときだけ触れる。
          if echo "$secrets_json" | grep -q '"SIGNING_KEY_KID"'; then
            echo "Note: SIGNING_KEY_KID is set. It is only read for the pre-#23 single-JWK format and is ignored once SIGNING_KEY_JWK holds a JWK Set (runbook 2.4.4)."
          fi

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: pnpm exec wrangler deploy --env production

      # `wrangler deploy` の exit 0 はアップロードの成功しか示さない。
      # 起動を拒否する Worker でもデプロイ自体は成功するため、実際に
      # /health を叩いて中身まで確かめる（#66）。
      #
      # ステータスだけでなく body を検証するのが肝。`--env production` を
      # 付け忘れたデプロイは ENVIRONMENT=development のまま 200 を返し、
      # その 1 つの値で メール送信の実プロバイダ強制・IP_HASH_PEPPER の
      # 強制・Cookie の __Host- と Secure が同時に無効になる。
      # ステータスだけ見る検査はこれを素通りさせる。
      #
      # checks.signingKey は HTTP ステータスに影響しない（docs/runbook.md 4.4）。
      # Secret と signing_key_metadata が食い違っていても /health は 200 を返す
      # ので、ここで本文を突き合わせないと不整合がデプロイを通過する。
      # 期待値は "ok" 固定で、"unavailable"（署名できない）と
      # "not_published"（JWKS に出ていない）はどちらも赤にする。
      #
      # curl とリトライの実体は scripts/smoke-probe.sh にある。3 つの Worker
      # すべてが同じものを使う。複数箇所に写すと片方だけ直す事故が起きる。
      #
      # PRODUCTION_URL が未設定の間は skip する。
      - name: Smoke test the deployed Worker
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the smoke test."
            exit 0
          fi
          scripts/smoke-probe.sh "${PRODUCTION_URL%/}/health" 200 \
            --jq .status ok \
            --jq .checks.database ok \
            --jq .checks.signingKey ok
          # `--env production` の付け忘れは Discovery の issuer で見る（RR-18）。
          #
          # 以前は /health の `.environment` を読んでいたが、未認証で叩ける
          # endpoint に構成情報を置くのをやめた。付け忘れると ENVIRONMENT と
          # 一緒に ISSUER も既定値（http://localhost:8787）のまま乗るので、
          # **同じ間違いを issuer で検出できる。** しかも Discovery は
          # OIDC が issuer の公開を必須にしているので、検査のために
          # 公開面を増やしたことにならない。
          #
          # **キャッシュ回避のクエリを付ける。** #125 で Discovery に
          # `Cache-Control: public, max-age=300` が付いた（JWKS と揃えた値）。
          # /health は `no-store` なので関係なかったが、こちらは**デプロイ直後に
          # 前のデプロイの応答を読む**可能性がある。それでは「付け忘れ」を
          # 検出するという目的を果たせない。クエリを変えればキャッシュキーが
          # 変わり、Discovery 側はパスでしかルートを解決しないので応答は同じ。
          scripts/smoke-probe.sh \
            "${PRODUCTION_URL%/}/.well-known/openid-configuration?cache_bust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 200 \
            --jq .issuer "${PRODUCTION_URL%/}"

      # **ブラウザが送る形の form を 1 本通す（#226）。**
      #
      # 上の 2 つは GET しか出していない。ログイン・新規登録・ログアウトの
      # すべてが本番で壊れていたとき、この 2 つは緑のままだった。原因は
      # `Referrer-Policy: no-referrer` で `Origin: null` になることで、
      # **GET では一度も現れない**（form を POST したときだけ起きる）。
      #
      # 単体テストも素通りさせた。テストが `Origin` を明示的に付けていて、
      # 実ブラウザが送る形を一度も通していなかったため。#216（wrangler が
      # 何をするか）・#217（Cloudflare の route が何をするか）と同じ形で、
      # **こちらが書いていない部分の振る舞い**は外から通さないと分からない。
      #
      # 宛先は形式不正の文字列で、`EmailAddress.tryCreate` が null を返した
      # 時点で弾かれる。D1 に行は増えず、誰にもメールは飛ばない
      # （scripts/smoke-form-probe.sh の冒頭に根拠を書いてある）。
      - name: Smoke test the no-JS form path
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the form smoke test."
            exit 0
          fi
          scripts/smoke-form-probe.sh "${PRODUCTION_URL%/}"

      # **ページに書いてある URL を、実際に取りに行く（#211）。**
      #
      # URL に内容ハッシュを入れたとき、`/ui/u18.css` が 404 になった。
      # **その CSS を借りていた nfc-worker のカード画面は、何も変えて
      # いないのにスタイルを失う。** 画面は描かれるので 500 にもならず、
      # 外形監視にも出ない。両側のテストは自分の Worker の内側に閉じて
      # いて、どちらもそれを見られなかった。
      #
      # **auth-worker だけでは足りない。** ハッシュ付きアセットを配る Worker は
      # 3 つあり（auth / dashboard / nfc）、**それぞれが自分でバンドルを生成して
      # 自分でハッシュを決めている。** 以前この検査は `/login` だけを見ていて、
      # dashboard-worker のアセットは誰も本番で確かめていなかった ——
      # 上に書いた失敗が、Worker 1 つ隣で再発できる状態だった。
      # 既定のページ一覧はスクリプトが持ち、`pnpm check:asset-pages` が
      # 「配っている Worker が全部そこに居るか」を突き合わせる。
      #
      # ここで見るのは「URL が正しいか」ではなく**本番で引けるか**である。
      # route の解決も、デプロイの順序も、キャッシュの残りも、ひっくるめて
      # 外から 1 回通す。#226 の form 経路と同じ理由で、**こちらが書いて
      # いない部分の振る舞い**は外から通さないと分からない。
      #
      # GET しか出さない。認証も要らない。
      - name: Smoke test the assets the page references
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the asset smoke test."
            exit 0
          fi
          # ページは渡さない。**既定の一覧はスクリプト側が持つ** ——
          # ここに書くと、`check:asset-pages` が突き合わせる相手が
          # 2 箇所になる（ワークフローとスクリプト）。
          scripts/smoke-asset-probe.sh "${PRODUCTION_URL%/}"

      # **Passkey の options 側だけ本番で踏む。**
      #
      # 仕様書 §13 は「Passkey ログインの本番経路が未確認」を残件として
      # 挙げている。認証器を伴う往復は機械では踏めないが、**options の
      # 発行だけは踏める** —— そして **RP ID の取り違えはそこに現れる。**
      #
      # RP ID はゾーン（`under18.dev`）でなければならない（§14.1 決定 1）。
      # ホスト名にすると**登録済みの Passkey が全部使えなくなる。**
      # 変えた日に全員が締め出される形なので、気づける場所を 1 つ置く。
      #
      # `webauthn_challenges` に行が 1 つ増えるが、保持は 24 時間で Cron が
      # 消す。誰のログインかを問わない設計なので `user_id` も入らない。
      - name: Smoke test the passkey login options
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the passkey smoke test."
            exit 0
          fi
          scripts/smoke-passkey-probe.sh "${PRODUCTION_URL%/}"

  # nfc-worker も IdentityRPC への Service Binding を持つ（セッション照会）。
  # 参照先が無いと起動しないので auth-worker の後。dashboard-worker とは
  # 互いに依存しないため、並列で構わない。
  #
  # **死活確認に /health を使わない。** ただし理由は「叩けないから」では
  # ない —— **実測では叩ける**（#280）。
  #
  # route は `go.under18.dev/c/*` ではなく **`go.under18.dev/*`** なので、
  # この Worker の全パスがそのホストに届く:
  #
  #     https://go.under18.dev/health              200
  #     https://go.under18.dev/account/nfc/cards   401（認証で止まる）
  #
  # ここで `/c/*` を使うのは、**見ている範囲が広いから**である。
  # `/health` は Identity にも D1 にも触れずに答えると決めてあり
  # （`src/presentation/http/app.ts` のコメント）、**Worker が起動した
  # ことしか言わない。** `/c/*` は**ルーティング + 起動 + カードの解決
  # （NFC_DB の読み）**まで通る。
  #
  # 本文まで見るのは「正しい Worker が答えていること」を確かめるため。
  # 404 を返す主体は他にもいる（route の割り当てを間違えれば dashboard や
  # auth の 404 が返る）ので、ステータスだけでは足りない。
  #
  # **ただし「/health はどの Worker でも似た形を返すので取り違えを
  # 捕まえられない」ではない。** 本文が Worker を名乗っている:
  #
  #     go.under18.dev/health    {"status":"ok","service":"u18-nfc",...}
  #     auth.under18.dev/health  {"status":"ok","service":"u18-auth",...}
  #
  # `--contains '"service":"u18-nfc"'` と書けば取り違えは捕まる。
  # `/c/*` を選ぶ理由は**範囲**であって、名乗らないことではない。
  #
  # **長らく「/health はどちらの route にも当たらず外から叩けない（#97）」と
  # 書いてあった。** 結論（/c/* を使う）は変わらないが、**理由が事実では
  # なかった。** 次に「nfc は /health を公開していない」を前提に何かを
  # 決めると、その前提が間違っている。
  deploy-nfc-worker:
    name: Deploy nfc-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, deploy-auth-worker]
    if: needs.preflight.outputs.ready == 'true' && needs.deploy-auth-worker.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/nfc-worker
        run: pnpm exec wrangler deploy --env production

      # 存在しないカード ID を引いて 404 と本文を確かめる（#97）。
      #
      # ID は CARD_ID_PATTERN（/^[a-z0-9_]{1,64}$/）に合う形にしてある。
      # わざと不正な形にすると入口の形式チェックで弾かれて終わり、
      # ルーティングと Worker の起動しか確かめられない。合う形にすれば
      # 解決処理まで通る。
      #
      # 本文まで見るのは「正しい Worker が答えていること」を確かめるため。
      # 404 を返す主体は他にもいる（route の割り当てを間違えれば
      # dashboard や auth の 404 が返る）ので、ステータスだけでは足りない。
      #
      # 限界: NFC_DB に到達できない場合も resolveCard が失敗して同じ 404 に
      # なる。この検査は DB の死活までは見ていない。
      #
      # deploy_smoke_probe という ID のカードを実際に作るとこの検査は
      # 302 になって落ちる。作らないこと。
      - name: Smoke test the deployed Worker
        env:
          NFC_SHORT_URL: ${{ vars.NFC_SHORT_URL }}
        run: |
          if [ -z "$NFC_SHORT_URL" ]; then
            echo "::warning::NFC_SHORT_URL repository variable is not set, skipping the smoke test. Set it to the production short-URL origin (e.g. https://go.under18.dev)."
            exit 0
          fi
          scripts/smoke-probe.sh "${NFC_SHORT_URL%/}/c/deploy_smoke_probe" 404 \
            --contains "このカードは利用できません。"

  deploy-dashboard-worker:
    name: Deploy dashboard-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, deploy-auth-worker]
    if: needs.preflight.outputs.ready == 'true' && needs.deploy-auth-worker.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/dashboard-worker
        run: pnpm exec wrangler deploy --env production

      # Cookie を付けずに /account/api/me を叩いて 401 を確かめる（#97）。
      # dashboard にも外から叩ける /health は無い（auth.under18.dev/health は
      # 最長一致で auth-worker に入る）ので、既存の応答をそのまま使う。
      #
      # 401 の本文まで見るのは、正しい Worker が答えていることの確認。
      #
      # **Referrer-Policy も見る（#228）。** auth-worker は #226 でこの値を
      # 直したが、**dashboard は直っていなかった** —— 修正のコメントだけが
      # 共有の `@u18/web-ui` に入り、設定は auth-worker の `app.ts` にしか
      # 入らなかった。本番の /account はそのあとも `no-referrer` を返し続け、
      # 単体テストも既存のスモークもそれを見ていなかった。
      #
      # この Worker にはまだ form POST が無いので、いまは無害である。
      # だからこそ**検査が要る** —— 無事である理由が「form がまだ無い」
      # ことだけで、#208 を入れた瞬間に #226 と同じ障害を踏む。
      #
      # **このステップは緑である。** かつては #106（dashboard-worker の
      # 全エンドポイントが本番 route と噛み合わず 404）のせいで落ちるのが
      # 正しい状態で、ここにもそう書いてあった。#106 は 2026-10-24 に
      # 閉じており、直近のデプロイはすべて success である。
      #
      # **古い「落ちるのが正しい」を残さない。** 残すと、ここが本当に赤く
      # なったときに「ああ #106 か」で流される。このステップが赤いのは、
      # これから先は常に直すべき何かが起きたという意味である。
      - name: Smoke test the deployed Worker
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the smoke test."
            exit 0
          fi
          scripts/smoke-probe.sh "${PRODUCTION_URL%/}/account/api/me" 401 \
            --jq .error unauthenticated \
            --header Referrer-Policy same-origin

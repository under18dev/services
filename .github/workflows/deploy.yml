name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/setup-workspace/action.yml"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: D1 マイグレーションの適用を飛ばす
        type: boolean
        default: false

# デプロイは同時に走らせない。RPC 契約の変更時にデプロイ順が崩れると
# dashboard-worker が存在しない entrypoint を呼ぶ（仕様書 4.4）。
#
# このワークフローは必ず `--env production` でデプロイする。付け忘れると
# Worker 名が `u18-auth` / `u18-dashboard` になり、本番の dashboard が指す
# `u18-auth-production` とは別物が増えるだけで、どこからも束縛されない
# 孤児 Worker が残る（#42）。部分的に手でデプロイした後はこれを確認すること。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cloudflare 側の準備が終わるまで、main への push のたびに赤くするのではなく
  # 理由を示して停止する。
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: check
        name: Check deploy prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          blockers=0
          summary=""

          note() { # 1 行の blocker を記録する
            blockers=$((blockers + 1))
            summary="${summary}
          - $1"
            ready=false
          }

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            note "Cloudflare secrets are not set (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)."
          fi

          # wrangler.jsonc に残る placeholder を埋める前にデプロイすると、
          # 存在しない DB を指すか、localhost を広告する Worker が本番に出る。
          #
          # 残り 1 件になっても「ほぼ緑」ではない。1 件でもデプロイは止まる。
          # 件数と残っている中身を必ず出し、読んだ人が推測しなくて済むようにする。
          #
          # 対象ファイルを列挙しないのは、列挙だと Worker が増えたときに
          # 足し忘れるから。#92 で nfc-worker が入ったとき、ここは 2 ファイル
          # しか見ておらず、REPLACE_WITH_NFC_D1_DATABASE_ID が残ったままでも
          # preflight は緑になる状態だった。走査なら次の Worker も自動で入る。
          configs=""
          for cfg in apps/*/wrangler.jsonc; do
            [ -e "$cfg" ] || continue
            configs="$configs $cfg"
          done

          if [ -z "$configs" ]; then
            # glob が当たらないのは「placeholder が無い」ではなく
            # 「検査できていない」。緑にせず blocker として扱う。
            note "No apps/*/wrangler.jsonc found, so the placeholder check never ran. This is a workflow bug, not a clean tree."
          fi

          found=0
          for f in $configs; do
            n="$(grep -c "REPLACE_WITH_" "$f" || true)"
            found=$((found + n))
          done

          if [ "$found" != "0" ]; then
            note "$found REPLACE_WITH_ placeholder(s) remain in wrangler config:"
            for f in $configs; do
              hits="$(grep -n "REPLACE_WITH_" "$f" || true)"
              [ -z "$hits" ] && continue
              summary="${summary}
              $f:"
              while IFS= read -r line; do
                summary="${summary}
                $line"
              done <<< "$hits"
            done
          fi

          {
            echo "## Deploy preflight"
            echo
            if [ "$ready" = "true" ]; then
              echo "All prerequisites satisfied. Proceeding with deploy."
            else
              echo "**Deploy is BLOCKED.** $blockers blocker(s) remaining:"
              echo "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ready" = "true" ]; then
            echo "All deploy prerequisites satisfied."
          else
            echo "::warning::Deploy is BLOCKED by $blockers item(s). Nothing will be deployed. See the job summary for details."
            echo "$summary"
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && !inputs.skip_migrations
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # スキーマから生成した SQL がコミットされているかを確かめる。
      # 生成漏れのまま本番に当てると、コードと DB が食い違う。
      - name: Verify migrations are committed
        run: |
          pnpm db:generate
          # 差分が無ければ drizzle-kit は何も書かない（"No schema changes"）。
          # 新規マイグレーションは追跡外ファイルとして現れるので、git diff では
          # 検出できない。untracked も見る git status を使う。
          #
          # packages/db だけでなく packages/*/ を見る。ルートの db:generate は
          # Identity と NFC の両方を生成するのに、ここが packages/db しか
          # 見ていないと NFC スキーマの生成漏れを素通しする（#92）。
          #
          # 末尾の /* は必須。git の pathspec はワイルドカードを含んだ時点で
          # 「ディレクトリ前方一致」をやめてフルパスの glob 照合になるため、
          # 'packages/*/drizzle' は packages/db/drizzle/0000_x.sql に
          # 一致せず、drift を 1 件も出さないまま緑になる。
          # 検査範囲を広げたつもりで全滅させうるので、下の自己検査を外さないこと。
          pathspec='packages/*/drizzle/*'

          tracked="$(git ls-files -- "$pathspec" | wc -l | tr -d ' ')"
          if [ "$tracked" = "0" ]; then
            echo "::error::The pathspec '$pathspec' matches no tracked migration files, so the drift check would pass without checking anything. Fix the pathspec, do not relax this guard."
            exit 1
          fi
          echo "Drift pathspec '$pathspec' covers $tracked tracked file(s)."

          drift="$(git status --porcelain -- "$pathspec")"
          if [ -n "$drift" ]; then
            echo "::error::Drizzle schema and committed migrations are out of sync. Run 'pnpm db:generate' and commit the generated SQL."
            echo "$drift"
            exit 1
          fi

      # env.production は d1_databases を再定義するので、--env を付けないと
      # 開発側の binding にマイグレーションを当ててしまう。
      - name: wrangler d1 migrations apply (Identity)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: pnpm exec wrangler d1 migrations apply u18-identity --remote --env production

      # NFC は Identity とは別の D1（仕様書 4.1 / apps/nfc-worker/wrangler.jsonc）。
      # binding も migrations_dir も分かれているので、適用も別に実行する。
      # ここを auth-worker の working-directory から打つと、
      # migrations_dir が packages/db を指したまま Identity 用の SQL を
      # NFC の DB に流し込むので、必ず apps/nfc-worker から実行すること。
      #
      # 2 つの DB は互いに独立なので順序に意味は無い。ただし Identity が
      # 適用済みで NFC が失敗する中途半端な状態はありうる（別 DB なので
      # 巻き戻さず、再実行で先へ進める）。
      - name: wrangler d1 migrations apply (NFC)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/nfc-worker
        run: pnpm exec wrangler d1 migrations apply u18-nfc --remote --env production

  # auth-worker が先。dashboard-worker は IdentityRPC entrypoint に依存するため、
  # 新しい RPC メソッドを使う dashboard を先に出すと参照先が無い（仕様書 4.4）。
  deploy-auth-worker:
    name: Deploy auth-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, migrate]
    if: always() && needs.preflight.outputs.ready == 'true' && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      # auth-worker は development 以外で IP_HASH_PEPPER / SIGNING_KEY_JWK 等が
      # 無いと起動を拒否する。デプロイ自体は成功して実リクエストで初めて落ちる
      # ため、先に Workers Secret の「名前」だけを確認しておく（値は取得しない）。
      # 初回デプロイ時は Worker 自体が存在せず一覧を取れないので、ここでは
      # 落とさずに警告にとどめる。
      - name: Check required Worker secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: |
          if ! secrets_json="$(pnpm exec wrangler secret list --env production 2>/dev/null)"; then
            echo "::warning::Could not list Worker secrets (the Worker may not exist yet on a first deploy). Skipping the check."
            exit 0
          fi
          missing=""
          for name in SIGNING_KEY_JWK SIGNING_KEY_KID IP_HASH_PEPPER; do
            echo "$secrets_json" | grep -q "\"$name\"" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing Worker secrets:$missing. Set them with 'wrangler secret put <NAME> --env production'; auth-worker refuses to boot without them outside development."
          else
            echo "All required Worker secrets are present."
          fi

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth-worker
        run: pnpm exec wrangler deploy --env production

      # `wrangler deploy` の exit 0 はアップロードの成功しか示さない。
      # 起動を拒否する Worker でもデプロイ自体は成功するため、実際に
      # /health を叩いて中身まで確かめる（#66）。
      #
      # ステータスだけでなく body を検証するのが肝。`--env production` を
      # 付け忘れたデプロイは ENVIRONMENT=development のまま 200 を返し、
      # その 1 つの値で メール送信の実プロバイダ強制・IP_HASH_PEPPER の
      # 強制・Cookie の __Host- と Secure が同時に無効になる。
      # ステータスだけ見る検査はこれを素通りさせる。
      #
      # curl とリトライの実体は scripts/smoke-probe.sh にある。3 つの Worker
      # すべてが同じものを使う。複数箇所に写すと片方だけ直す事故が起きる。
      #
      # PRODUCTION_URL が未設定の間は skip する。
      - name: Smoke test the deployed Worker
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the smoke test."
            exit 0
          fi
          scripts/smoke-probe.sh "${PRODUCTION_URL%/}/health" 200 \
            --jq .status ok \
            --jq .checks.database ok \
            --jq .environment production

  # nfc-worker も IdentityRPC への Service Binding を持つ（セッション照会）。
  # 参照先が無いと起動しないので auth-worker の後。dashboard-worker とは
  # 互いに依存しないため、並列で構わない。
  #
  # /health は使えない。nfc-worker の本番 route は go.under18.dev/c/* と
  # auth.under18.dev/account/nfc/* の 2 つだけで、/health はどちらにも
  # 当たらず外から叩けない（#97）。
  # 死活確認には既存の応答をそのまま使う。新しい公開面を増やさずに済む。
  deploy-nfc-worker:
    name: Deploy nfc-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, deploy-auth-worker]
    if: needs.preflight.outputs.ready == 'true' && needs.deploy-auth-worker.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/nfc-worker
        run: pnpm exec wrangler deploy --env production

      # 存在しないカード ID を引いて 404 と本文を確かめる（#97）。
      #
      # ID は CARD_ID_PATTERN（/^[a-z0-9_]{1,64}$/）に合う形にしてある。
      # わざと不正な形にすると入口の形式チェックで弾かれて終わり、
      # ルーティングと Worker の起動しか確かめられない。合う形にすれば
      # 解決処理まで通る。
      #
      # 本文まで見るのは「正しい Worker が答えていること」を確かめるため。
      # 404 を返す主体は他にもいる（route の割り当てを間違えれば
      # dashboard や auth の 404 が返る）ので、ステータスだけでは足りない。
      #
      # 限界: NFC_DB に到達できない場合も resolveCard が失敗して同じ 404 に
      # なる。この検査は DB の死活までは見ていない。
      #
      # deploy_smoke_probe という ID のカードを実際に作るとこの検査は
      # 302 になって落ちる。作らないこと。
      - name: Smoke test the deployed Worker
        env:
          NFC_SHORT_URL: ${{ vars.NFC_SHORT_URL }}
        run: |
          if [ -z "$NFC_SHORT_URL" ]; then
            echo "::warning::NFC_SHORT_URL repository variable is not set, skipping the smoke test. Set it to the production short-URL origin (e.g. https://go.under18.dev)."
            exit 0
          fi
          scripts/smoke-probe.sh "${NFC_SHORT_URL%/}/c/deploy_smoke_probe" 404 \
            --contains "このカードは利用できません。"

  deploy-dashboard-worker:
    name: Deploy dashboard-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, deploy-auth-worker]
    if: needs.preflight.outputs.ready == 'true' && needs.deploy-auth-worker.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/dashboard-worker
        run: pnpm exec wrangler deploy --env production

      # Cookie を付けずに /account/api/me を叩いて 401 を確かめる（#97）。
      # dashboard にも外から叩ける /health は無い（auth.under18.dev/health は
      # 最長一致で auth-worker に入る）ので、既存の応答をそのまま使う。
      #
      # 401 の本文まで見るのは、正しい Worker が答えていることの確認。
      #
      # **このステップは #106 が直るまで落ちる。** dashboard-worker は
      # /api/me を登録しているが本番 route は auth.under18.dev/account/* で、
      # Cloudflare の route は一致した接頭辞を URL から取り除かない。
      # つまり Worker には /account/api/me が丸ごと届き、どのハンドラにも
      # 一致せず 404 になる。落ちるのが正しい状態で、
      # #106 の修正が入ったときに緑へ変わることが修正が効いた証拠になる。
      - name: Smoke test the deployed Worker
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL repository variable is not set, skipping the smoke test."
            exit 0
          fi
          scripts/smoke-probe.sh "${PRODUCTION_URL%/}/account/api/me" 401 \
            --jq .error unauthenticated

# 日次バックアップが止まっていないかを、backup.yml とは別の経路で見る（#361）。
#
# ## なぜ別のワークフローにするのか
#
# **同じ `schedule:` の中に置いた見張りは、自分が走っていないことを
# 観測できない。** `backup.yml` が止まれば、その中に置いた見張りも一緒に
# 止まる —— **止まった場合にだけ沈黙する検査**になる
# （`.github/workflows/README.md` の「緑の見分け方」）。
#
# 2 本の `schedule:` が同時に止まる確率は、1 本が止まる確率より低い。
# **根本解決ではない**（理屈の上では両方とも止まりうる）が、独立した
# 観測点を増やすことには意味がある。
#
# ## 何を見るか
#
# 実体は `scripts/check-backup-freshness.mjs`。Cloudflare の R2 API を
# 直接叩いて、`backup-d1.mjs` の `DATABASES` に並ぶ DB ごとに最新の
# バックアップが何時間前かを見る。詳しい設計（閾値の根拠、API を選んだ
# 理由）はスクリプトの冒頭を参照。
name: Backup monitor

on:
  schedule:
    # 05:23 UTC。backup.yml（20:23 UTC、前日）の **9 時間後**。
    #
    # **以前は 6 時間後（毎時 0 分）だった。** この repo で観測できた
    # `schedule` 起動実績が 2 例に増え、どちらも時間単位でずれていた
    # ことを受けて、**両方とも毎時 0 分から外し、間隔も広げた**（分を
    # 散らすのは混雑を避けるためで、下の遅延そのものが無くなるわけ
    # ではない）。
    #
    #     security.yml の cron: 17 3 * * 1   → 5 時間 35 分遅れ（2026-10-26）
    #     backup.yml（変更前）: 0 21 * * *   → 3 時間 37 分遅れ（2026-10-31、成功）
    #
    # ## 9 時間というギャップの意味
    #
    # バックアップが実測の最大遅延（5 時間 35 分）ぶん遅れて走っても、
    # まだ **3 時間以上**の余裕を残してこの見張りより先に終わる計算になる
    # （20:23 + 5:35 = 02:58 UTC、見張りは 05:23 UTC）。**一方で、丸 1 日
    # 完全に飛んだ場合は 33 時間のギャップになり、下の 27 時間の閾値を
    # 確実に超える。** 「毎日の遅延は吸収し、1 日分の欠落は検知する」
    # という線をこの間隔で引いている。
    #
    # `security.yml`（Mon 03:17 UTC）とは曜日も時刻も被らない。
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-freshness:
    name: Check backup freshness
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace

      - name: 日次バックアップが止まっていないか確かめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-backup-freshness.mjs

      - name: Report
        if: failure()
        run: |
          {
            echo "## Backup monitor — 止まっている"
            echo
            echo "**日次バックアップのいずれかが、期待される間隔を超えて古い。**"
            echo "対応は runbook §12.11。まず \`backup.yml\` の Actions タブを開き、"
            echo "**最後に走った日付**を見ること —— \`schedule:\` 自体が止まっている"
            echo "可能性がある（public リポジトリは 60 日の非活動で自動停止する）。"
            echo
            echo "走ってはいるが失敗している場合は \`backup.yml\` の失敗ログを読むこと。"
          } >> "$GITHUB_STEP_SUMMARY"
